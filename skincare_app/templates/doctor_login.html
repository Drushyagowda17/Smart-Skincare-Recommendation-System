{% extends "base.html" %}
{% block title %}Doctor Login{% endblock %}
{% block content %}
<section class="auth-section py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 col-xl-4">
                <div class="glass-card p-4 p-lg-5 auth-card">
                    <div class="text-center mb-4">
                        <div class="auth-icon doctor-icon mb-3"><i class="bi bi-heart-pulse"></i></div>
                        <h2 class="fw-bold">Doctor Portal</h2>
                        <p class="text-muted">Login to manage consultations</p>
                    </div>
                    <form method="POST" action="{{ url_for('doctor_login') }}">
                        <div class="mb-3">
                            <label class="form-label fw-medium">Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="Doctor email" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-medium">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="Password" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-info w-100 rounded-pill py-2 text-white mb-3">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Doctor Login
                        </button>
                    </form>
                    <hr class="my-4">
                    <div class="text-center">
                        <a href="{{ url_for('login') }}" class="small text-muted"><i class="bi bi-person me-1"></i>Login as User</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
