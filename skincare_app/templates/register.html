{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<section class="auth-section py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 col-xl-4">
                <div class="glass-card p-4 p-lg-5 auth-card">
                    <div class="text-center mb-4">
                        <div class="auth-icon mb-3"><i class="bi bi-person-plus"></i></div>
                        <h2 class="fw-bold">Create Account</h2>
                        <p class="text-muted">Join GlowGuide for personalized skincare</p>
                    </div>
                    <form method="POST" action="{{ url_for('register') }}" id="registerForm">
                        <div class="mb-3">
                            <label class="form-label fw-medium">Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" name="username" class="form-control" placeholder="Choose a username" required minlength="3">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium">Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required minlength="6" id="regPassword">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-medium">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" required id="regConfirm">
                            </div>
                            <div class="invalid-feedback" id="passwordMismatch">Passwords do not match.</div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 mb-3">
                            <i class="bi bi-person-plus me-2"></i>Create Account
                        </button>
                    </form>
                    <div class="text-center">
                        <p class="text-muted mb-1">Already have an account?</p>
                        <a href="{{ url_for('login') }}" class="fw-semibold text-primary text-decoration-none">Login <i class="bi bi-arrow-right"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('registerForm').addEventListener('submit', function(e) {
    var pw = document.getElementById('regPassword').value;
    var cf = document.getElementById('regConfirm').value;
    if (pw !== cf) {
        e.preventDefault();
        document.getElementById('regConfirm').classList.add('is-invalid');
        document.getElementById('passwordMismatch').style.display = 'block';
    }
});
</script>
{% endblock %}
