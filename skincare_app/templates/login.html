{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="auth-section py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 col-xl-4">
                <div class="glass-card p-4 p-lg-5 auth-card">
                    <div class="text-center mb-4">
                        <div class="auth-icon mb-3"><i class="bi bi-person-circle"></i></div>
                        <h2 class="fw-bold">Welcome Back</h2>
                        <p class="text-muted">Login to your GlowGuide account</p>
                    </div>
                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label class="form-label fw-medium">Username or Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" name="username" class="form-control" placeholder="Enter username or email" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-medium">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 mb-3">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Login
                        </button>
                    </form>
                    <div class="text-center">
                        <p class="text-muted mb-1">Don't have an account?</p>
                        <a href="{{ url_for('register') }}" class="fw-semibold text-primary text-decoration-none">Create Account <i class="bi bi-arrow-right"></i></a>
                    </div>
                    <hr class="my-4">
                    <div class="text-center">
                        <a href="{{ url_for('doctor_login') }}" class="small text-muted"><i class="bi bi-heart-pulse me-1"></i>Login as Doctor</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
